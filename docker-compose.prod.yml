services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: siterelation-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: https://${DOMAIN}
      PUBLIC_BACKEND_URL: https://api.${DOMAIN}
      PUBLIC_FRONTEND_URL: https://${DOMAIN}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - edge

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://api.${DOMAIN}
    container_name: siterelation-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - edge

# No "caddy" service here and no host ports on backend/frontend: this
# project's containers don't own 80/443 themselves. They join the "edge"
# network (an existing external network your VPS's own Caddy is already on)
# so that Caddy can reverse_proxy to them by container name -- see
# Caddyfile in this repo for the exact site blocks to add to your existing
# Caddyfile, and DEPLOYMENT.md for how to find your Caddy's network name.
networks:
  edge:
    external: true
    name: ${CADDY_NETWORK}

volumes:
  db_data:
